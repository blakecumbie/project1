<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Defense-in-depth CSP. The authoritative policy is installed in
      src/main/security/csp.ts via webRequest.onHeadersReceived; this <meta>
      tag duplicates the production policy minus 'unsafe-eval' so that even
      if the header pipeline is bypassed (e.g. for a custom-protocol load),
      the renderer cannot eval() or talk to anywhere except api.anthropic.com.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' sopimg:; font-src 'self'; connect-src 'self' https://api.anthropic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
    <title>SOP Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
